<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krafty Content Engine</title><style>
*{box-sizing:border-box}body{margin:0;background:#101012;color:#eee;font:15px system-ui}aside{width:230px;background:#18181b;padding:24px;position:fixed;inset:0 auto 0 0}h1{font-size:24px}small,p{color:#a1a1aa}nav button{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:#ccc;border:0;padding:12px;border-radius:8px;cursor:pointer}nav button.active,button.primary{background:#b91c1c;color:white}main{margin-left:230px;padding:32px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}.tile,section{background:#1c1c20;border:1px solid #303036;border-radius:12px;padding:20px;margin-bottom:16px}.number{font-size:30px;font-weight:700;margin:10px 0}button.primary{border:0;padding:12px;border-radius:8px;cursor:pointer}label{display:block;margin:14px 0}input,select{display:block;width:100%;background:#111;color:white;border:1px solid #444;padding:12px;border-radius:6px;margin-top:6px}li{padding:10px;border-bottom:1px solid #333}progress{width:100%;accent-color:#b91c1c}@media(max-width:700px){aside{position:static;width:auto;padding:12px}nav{display:flex;overflow:auto}nav button{width:auto;white-space:nowrap}main{margin:0;padding:16px}}
</style></head><body><aside><h1>KRAFTY<span style="color:#ef4444">.</span></h1><small>CONTENT ENGINE / V0.1</small><nav id="nav"></nav></aside><main><header><h1 id="heading">Overview</h1><small>LOCAL PROTOTYPE · NOT CONNECTED</small></header><div id="view"></div></main><script>
const pages=['Overview','Campaigns','Music intelligence','Viral research','Footage library','Production','Distribution','Analytics','Budget','Settings'];
const descriptions={'Music intelligence':'Song emotion, BPM and audio segments will appear after backend integration.','Viral research':'YouTube discovery and permitted TikTok trend references. No live research connected.','Footage library':'Rights-cleared source media and scene metadata. No footage imported.','Production':'Render queue and clip review. Local renderer exists; dashboard integration pending.','Distribution':'Approved scheduling and account references. No accounts connected.','Analytics':'Views, watch time, shares and creative performance. No live data.','Settings':'PostgreSQL, AI and publishing integrations are not connected.'};
let campaign=null;
function show(page){document.getElementById('heading').textContent=page;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===page));const v=document.getElementById('view');
if(page==='Overview'){v.innerHTML='<div class="grid">'+[['Monthly target','2,500'],['Initial batch','500'],['Account target','5'],['Budget target','£25']].map(x=>'<div class="tile"><small>'+x[0]+'</small><div class="number">'+x[1]+'</div></div>').join('')+'</div><section><h2>Production pipeline</h2><progress value="0" max="2500"></progress><p>No live production data</p><ul>'+['Song analysis','Trend research','Rights-cleared footage','Scene selection','Rendering','Review'].map(x=>'<li>'+x+' — pending integration</li>').join('')+'</ul><button class="primary" id="new">New campaign</button></section>';document.getElementById('new').onclick=()=>show('Campaigns');}
else if(page==='Campaigns'){v.innerHTML='<section><h2>Campaign configuration</h2><form id="form"><label>Song title<input name="title" required></label><label>Emotion<select name="emotion"><option>Automatic</option><option>Joyful / playful</option><option>Romantic</option><option>Heartbreak</option><option>Energetic</option></select></label><label>Audience<input name="audience" value="Nigerian / African diaspora"></label><label>Clip target<input name="target" type="number" min="1" max="2500" value="500" required></label><button class="primary">Save local draft</button></form><p id="status"></p><button id="export" class="primary" hidden>Export draft JSON</button></section>';const f=document.getElementById('form');if(campaign)for(const k of Object.keys(campaign))f.elements[k].value=campaign[k];f.onsubmit=e=>{e.preventDefault();campaign=Object.fromEntries(new FormData(f));document.getElementById('status').textContent='Draft saved in this session. No render started.';document.getElementById('export').hidden=false;};document.getElementById('export').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(campaign,null,2)],{type:'application/json'}));a.href=url;a.download='campaign.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}
else if(page==='Budget'){v.innerHTML='<section><h2>£25 monthly target</h2><p>Estimated budget only. Database cost reservations are not connected.</p><progress value="0" max="25"></progress><p>Actual spend: unavailable</p></section>';}
else{v.innerHTML='<section><h2>'+page+'</h2><p>'+descriptions[page]+'</p></section>';}}
for(const p of pages){const b=document.createElement('button');b.textContent=p;b.onclick=()=>show(p);document.getElementById('nav').append(b)}show('Overview');
</script></body></html>
